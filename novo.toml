[package]
name        = "toml-nv"
version     = "0.1.0"
description = "TOML 1.0.0, read and written without performing anything: a typed value tree whose date arms are calendar-nv's civil types, a parser that names the line and the column of every refusal, dotted-key and table access, a canonical writer that preserves nothing, and an editing document that preserves comments, key order and spacing so a tool can change one value and hand the file back."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet.
stability   = "experimental"

# `core`: a document is text the caller already holds, and the parse
# is arithmetic over its bytes.  The one function that meets a stream,
# `tomlread.read_all<S: Read[e]>`, binds its cost rather than spending
# one, so it is charged whatever the caller's impl supplies (SPEC
# section 5.6).
layer       = "core"

category    = "data"

tags        = ["toml", "toml-1.0", "config", "parser", "formatter", "sans-io", "data"]
repository  = "https://github.com/novolang/toml-nv"
maintainers = ["novo-lang"]
# 0.12.0 is the first toolchain with list slicing, `if let` and
# `let … else`, which the bodies use.
novo        = ">= 0.12.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Reading and writing TOML"

[dependencies]
# calendar-nv supplies the civil types TOML's date-time forms are held
# in, `CivilDate`, `CivilTime` and `CivilDateTime`, so a TOML date and
# a calendar date are one type.  It validates the dates and times the
# parser reads, and writes them back out.  It is `core`, as this
# package is.
calendar-nv = "^0.2.0"
